/sllidar_node:
  ros__parameters:
    angle_compensate: true
    channel_type: serial
    frame_id: lidar_frame
    inverted: false
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: reliable
    scan_frequency: 10.0
    scan_mode: Sensitivity
    serial_baudrate: 115200
    serial_port: /dev/lidar
    tcp_ip: 192.168.0.7
    tcp_port: 20108
    udp_ip: 192.168.11.2
    udp_port: 8089
    use_sim_time: false

