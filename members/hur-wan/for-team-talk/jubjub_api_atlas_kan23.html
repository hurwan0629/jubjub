function closeMobile(){$('sidebar').classList.remove('open');$('shade').classList.remove('open')}
function flash(text){$('toast').textContent=text;$('toast').classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>$('toast').classList.remove('show'),1500)}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{let t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();let ok=document.execCommand('copy');t.remove();if(!ok)throw Error('copy unavailable')}flash('클립보드에 복사했습니다.')}catch(e){flash('복사 실패 · 텍스트를 직접 선택해 주세요.')}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){selectView(nav.dataset.nav);location.hash='view='+encodeURIComponent(nav.dataset.nav);return}const method=e.target.closest('[data-method]');if(method){state.method=method.dataset.method;render();return}const api=e.target.closest('[data-api]');if(api){updateSelected(api.dataset.api);history.replaceState(null,'','#api='+api.dataset.api);return}const cp=e.target.closest('[data-copy]');if(cp){copyText(cp.dataset.copy);return}const ln=e.target.closest('[data-link]');if(ln){const str=location.href.split('#')[0]+'#api='+ln.dataset.link;copyText(str);return}});
document.addEventListener('input',e=>{if(e.target.id==='apiSearch'){state.query=e.target.value;render({keepSearchFocus:true});}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)&&$('apiSearch')){e.preventDefault();$('apiSearch').focus()}else if(e.key==='Escape'){$('apiSearch')?.blur();closeMobile()}});
$('menuBtn').onclick=()=>{$('sidebar').classList.toggle('open');$('shade').classList.toggle('open')};$('shade').onclick=closeMobile;
function fromHash(){let h=decodeURIComponent(location.hash.replace(/^#/,''));if(h.startsWith('api=')){let id=h.slice(4);if(APIS.find(x=>x.id===id)){state.view='all';state.method='ALL';state.query='';state.selected=id;render();return}}if(h.startsWith('view=')){state.view=h.slice(5);state.method='ALL';state.query='';}render();}
window.addEventListener('hashchange',fromHash);fromHash();
</script>
</body>
</html>
